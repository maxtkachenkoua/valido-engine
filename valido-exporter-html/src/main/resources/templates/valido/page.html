<!doctype html>
<html th:lang="${locale}" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}"></title>
  <meta name="description" th:attr="content=${description}">
  <link rel="canonical" th:attr="href=${canonical}">
  <link th:each="alternate : ${hreflang}" rel="alternate" th:attr="hreflang=${alternate.locale},href=${alternate.href}">
  <link th:each="asset : ${stylesheets}" rel="stylesheet" th:attr="href=${asset.href}">
  <script th:inline="none">
    window.MathJax = {
      tex: { inlineMath: [['$','$']], displayMath: [['$$','$$']] },
      options: { skipHtmlTags: ['script','noscript','style','textarea','pre'] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <header th:replace="~{valido/fragments :: siteHeader}"></header>
  <main class="site-main">
    <section class="page-shell">
      <div class="container page-stack">
        <nav th:replace="~{valido/fragments :: breadcrumbs}"></nav>
        <header class="page-intro">
          <span class="eyebrow" th:text="${pageLabel}"></span>
          <h1 th:text="${heading}"></h1>
          <p th:if="${summary != ''}" th:text="${summary}"></p>
        </header>

        <section class="workbench-card" th:if="${forms.size() > 0}" aria-label="Tool input and output">
          <div class="workbench-heading">
            <span class="eyebrow">Workbench</span>
            <h2>Run the tool</h2>
            <p>Paste input, choose an action, and copy the result directly in your browser.</p>
          </div>
          <div class="workbench-list">
            <form class="tool-workbench"
                  th:each="form : ${forms}"
                  th:attr="id=${form.id},data-algorithm-id=${form.algorithmId},data-capability=${form.capability}">
              <div class="workbench-form-heading">
                <h3 th:text="${form.title}"></h3>
                <span class="input-mode-badge" data-input-mode-badge>Waiting for input</span>
              </div>
              <div class="field-grid">
                <label class="field"
                       th:each="input : ${form.inputs}"
                       th:classappend="${input.checkbox} ? ' field-inline' : ''">
                  <span th:text="${input.label}"></span>
                  <textarea th:if="${input.textarea}"
                            th:name="${input.name}"
                            th:placeholder="${input.placeholder}"
                            th:attr="required=${input.required}"></textarea>
                  <select th:if="${input.select}"
                          th:name="${input.name}"
                          th:attr="required=${input.required}">
                    <option th:each="option : ${input.options}"
                            th:value="${option.value}"
                            th:text="${option.label}"
                            th:selected="${option.value == input.defaultValue}"></option>
                  </select>
                  <input th:if="${!input.textarea && !input.select && !input.checkbox}"
                         th:type="${input.type}"
                         th:name="${input.name}"
                         th:value="${input.defaultValue}"
                         th:placeholder="${input.placeholder}"
                         th:attr="required=${input.required}">
                  <input th:if="${input.checkbox}"
                         type="checkbox"
                         th:name="${input.name}"
                         th:checked="${input.defaultValue == 'true'}">
                  <small th:if="${input.help != ''}" th:text="${input.help}"></small>
                </label>
              </div>
              <div class="button-row">
                <button type="button"
                        class="button button-primary"
                        th:each="action : ${form.actions}"
                        th:attr="data-action=${action.action}"
                        th:text="${action.label}"></button>
                <button type="button" class="button button-secondary" data-tool-copy>Copy result</button>
                <button type="button" class="button button-secondary" data-tool-download>Download result</button>
                <button type="button" class="button button-ghost" data-tool-clear>Clear</button>
              </div>
              <label class="field output-field">
                <span>Output</span>
                <textarea class="tool-output" readonly data-tool-output></textarea>
              </label>
              <p class="tool-message" aria-live="polite" data-tool-message></p>
              <div class="tool-feedback" data-tool-feedback></div>
              <div class="preview-panel" data-tool-preview></div>
              <details class="advanced-panel" data-advanced-panel>
                <summary>Advanced analysis</summary>
                <div data-tool-advanced></div>
              </details>
            </form>
          </div>
        </section>

        <article class="content-card" th:if="${sections.size() > 0}">
          <div class="section-heading">
            <span class="eyebrow">Documentation</span>
            <h2>Reference notes</h2>
          </div>
          <details class="doc-accordion" th:each="section : ${sections}">
            <summary th:text="${section.title}"></summary>
            <div class="rich-text" th:utext="${section.html()}"></div>
          </details>
        </article>

        <section class="related-section" th:if="${links.size() > 0}">
          <div class="section-heading">
            <span class="eyebrow" th:text="${pageType == 'tool' ? 'Related tools' : 'Browse'}"></span>
            <h2 th:text="${pageType == 'tool' ? 'Continue with related tools' : 'Available tools'}"></h2>
          </div>
          <div th:replace="~{valido/fragments :: linkList(${links}, 'card-grid')}"></div>
        </section>
      </div>
    </section>
  </main>
  <footer th:replace="~{valido/fragments :: siteFooter}"></footer>
  <script th:each="asset : ${scripts}" th:attr="src=${asset.href}"></script>
</body>
</html>
