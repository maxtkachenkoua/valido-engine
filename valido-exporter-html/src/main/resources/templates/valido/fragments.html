<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
  <header class="site-header" th:fragment="siteHeader">
    <div class="container header-inner">
      <a class="brand" th:href="${homePath}" aria-label="Home">
        <span class="brand-mark">V</span>
        <span class="brand-text" th:text="${siteName}"></span>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a th:each="item : ${navigation}"
           th:href="${item.path}"
           th:text="${item.title}"
           th:classappend="${item.path == currentPath} ? 'is-active' : ''"></a>
      </nav>
    </div>
  </header>

  <nav class="breadcrumbs" th:fragment="breadcrumbs" th:if="${breadcrumbs.size() > 0}" aria-label="Breadcrumb">
    <ol>
      <li th:each="crumb, iter : ${breadcrumbs}">
        <a th:if="${!iter.last}" th:href="${crumb.path}" th:text="${crumb.title}"></a>
        <span th:if="${iter.last}" th:text="${crumb.title}"></span>
      </li>
    </ol>
  </nav>

  <div th:fragment="linkList(items, className)" th:class="${className}">
    <a th:each="link : ${items}" th:href="${link.path}" class="link-card">
      <span th:text="${link.title}"></span>
      <span aria-hidden="true">→</span>
    </a>
  </div>

  <footer class="site-footer" th:fragment="siteFooter">
    <div class="container footer-inner">
      <a class="brand compact" th:href="${homePath}">
        <span class="brand-mark">V</span>
        <span class="brand-text" th:text="${siteName}"></span>
      </a>
      <p>Static tools generated by Valido Engine.</p>
    </div>
  </footer>
</body>
</html>
